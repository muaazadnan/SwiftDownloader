name: Build SwiftDownloader

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Create app icon
        run: |
          python -c "
          import struct, os
          os.makedirs('app/assets/icons', exist_ok=True)
          width, height = 16, 16
          img_size = width * height * 4
          header = struct.pack('<HHH', 0, 1, 1)
          entry = struct.pack('<BBBBHHII', width, height, 0, 0, 1, 32, img_size + 40, 22)
          bmp = struct.pack('<IiiHHIIiiII', 40, width, height*2, 1, 32, 0, img_size, 0, 0, 0, 0)
          pixels = bytes([0xF7, 0x81, 0x2F, 0xFF] * (width * height))
          mask = bytes([0] * (((width+31)//32)*4*height))
          with open('app/assets/icons/app_icon.ico', 'wb') as f:
              f.write(header + entry + bmp + pixels + mask)
          "
      - name: Build with PyInstaller
        run: |
          cd scripts
          pyinstaller swiftdownloader.spec --noconfirm
      - name: Verify build
        run: |
          if (Test-Path "dist/SwiftDownloader/SwiftDownloader.exe") {
            Write-Host "Build successful!"
          } else { exit 1 }
      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\swiftdownloader_setup.iss
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDownloader-Setup
          path: dist/SwiftDownloader_Setup.exe
      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDownloader-Portable
          path: dist/SwiftDownloader/
