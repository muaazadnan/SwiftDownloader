name: Build SwiftDownloader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwiftDownloader

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: python -m pytest tests/ -v

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SwiftDownloader

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller scripts/swiftdownloader.spec --noconfirm

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer
      run: iscc SwiftDownloader\installer\swiftdownloader_setup.iss
      working-directory: ${{ github.workspace }}

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: SwiftDownloader-Setup
        path: SwiftDownloader/installer/Output/SwiftDownloader_Setup.exe

    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: SwiftDownloader-Portable
        path: SwiftDownloader/dist/SwiftDownloader/**

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          SwiftDownloader-Setup/SwiftDownloader_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
