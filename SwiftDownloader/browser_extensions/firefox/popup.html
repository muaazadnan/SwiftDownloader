<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: 'Segoe UI', sans-serif;
      background: #0D1117;
      color: #E6EDF3;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #2F81F7;
    }
    .header .tagline {
      font-size: 11px;
      color: #8B949E;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #161B22;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.on { background: #3FB950; }
    .dot.off { background: #F85149; }
    .toggle-btn {
      background: #2F81F7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .toggle-btn:hover { background: #388BFD; }
    .toggle-btn.off { background: #21262D; color: #8B949E; }
    .url-input {
      width: 100%;
      padding: 10px 12px;
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 8px;
      color: #E6EDF3;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .url-input:focus { border-color: #2F81F7; outline: none; }
    .send-btn {
      background: transparent;
      color: #2F81F7;
      border: 1px solid #2F81F7;
      border-radius: 8px;
      padding: 8px;
      width: 100%;
      font-size: 13px;
      cursor: pointer;
    }
    .send-btn:hover { background: rgba(47,129,247,0.1); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>SwiftDownloader</h1>
      <div class="tagline">Free. Fast. Unlimited.</div>
    </div>
  </div>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking...</span>
  </div>

  <button class="toggle-btn" id="toggleBtn">Toggle</button>

  <input type="text" class="url-input" id="urlInput"
         placeholder="Paste URL to download...">
  <button class="send-btn" id="sendBtn">Send to SwiftDownloader</button>

  <script src="popup.js"></script>
</body>
</html>
